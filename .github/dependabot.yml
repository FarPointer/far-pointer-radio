version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directories:
      - /tools/python/czcache
      - /tools/python/czaudit
      - /tools/python/czarchive
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
