# Discarded prototype. Preserved for reference; do not install.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "czpublish"
version = "0.1.0"
description = "Publishes Convergence Zone playlist pages to WordPress from the playlist cache"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.31",
]

[project.scripts]
czpublish = "czpublish.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/czpublish"]
