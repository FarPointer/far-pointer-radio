[project]
name = "czaudit"
version = "0.1.0"
description = "Reconciles Convergence Zone set lists against Spinitron and writes the audit workbook"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

# Flat scripts run in place, imported by czcache through sys.path rather than installed.
[tool.uv]
package = false
