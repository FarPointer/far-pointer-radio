# Approved broadcast descriptions, keyed by air date (YYYY-MM-DD) or full broadcast id.
#
# The build extracts candidate descriptions from OneNote prose and Instagram captions.
# Both sources mix genuine promo copy with scratch/promotional boilerplate, so an
# extracted candidate is published as `description_status: "proposed"` and is NOT
# trustworthy. Text entered here becomes `"approved"`.
#
# Review reports/descriptions-review.md, then either paste the corrected text here or
# write `skip` to suppress the description for that broadcast entirely.
#
# Example:
#   2024-08-06: |
#     This week on Convergence Zone I'll premiere new space music from Seattle.
#   2023-10-17: skip
#
# Reviewed 2026-08-05 by Jim, reading all 35 proposed candidates in full. Every entry
# below is the extractor's candidate with the corrections he called, and nothing else --
# no rewriting, no new copy. The corrections are of three kinds:
#
#   * misspellings carried from the original notes (artist names, mostly)
#   * one unfinished parenthetical on 2024-09-24, completed with the attribution
#     it was waiting for
#   * one bad cut on 2025-10-21, where the extractor swept in the station sign-off and
#     an unrelated obituary paragraph from further down the note
#
# The other 124 broadcasts have no approved description, and that is now a real
# statement rather than an assumption: the two extractor bugs that were suppressing
# copy have been fixed, so what is left genuinely has no promo copy to find.

