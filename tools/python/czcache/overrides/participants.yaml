# Host attribution, keyed by air date (YYYY-MM-DD) or full broadcast id.
#
# This is the authority. `dj_ids` records which Spinitron login was used, not who hosted:
# both "Jim Causey" personas (173567, 174269) are Jim's, and 26 of MichaelG's 28 episodes
# were logged under Jim's original account. The build infers MichaelG from the presence
# of one of his workbooks; anything that rule gets wrong belongs here.
#
# coverage: "full" (on air for the whole show) or "partial" (joining part of it).
#
# Order matters: list the primary host first. Coverage says how much of the show someone
# was on, which is a different question from whose show it is -- both fund-drive nights
# are two hosts at "full", distinguished only by who is named first.
#
# Example:
#   2026-06-23:
#     - name: MichaelG
#       coverage: full
#   2025-10-14:
#     - name: MichaelG
#       coverage: full
#     - name: Jim Causey
#       coverage: full

# ---------------------------------------------------------------------------
# Reviewed 2026-08-05 against reports/attribution.md.

# MichaelG kept alternating through July 2026 but stopped producing workbooks after
# 2026-06-23, so the workbook rule silently handed his weeks to Jim. Confirmed by Jim.
# Nothing in any source records this -- without these two entries the archive shows
# five consecutive Jim weeks, and the every-other-week pattern looks like it ended a
# month before it did.
2026-07-07:
  - name: MichaelG
    coverage: full
2026-07-21:
  - name: MichaelG
    coverage: full

# Fund drive. MichaelG's show -- his programming and his song selection -- with Jim on
# air alongside him for the whole two hours, pitching and running the board. Both are
# hosts and both are `full`; MichaelG is listed first because the list is ordered
# primary host first (see the header).
2025-10-14:
  - name: MichaelG
    coverage: full
  - name: Jim Causey
    coverage: full

# ---------------------------------------------------------------------------
# Found while reviewing the descriptions, not the attribution report -- the promo copy
# names people no structured source records. Worth knowing that the blurbs are a real
# attribution source in their own right for the guest-host cases.

# "Join me and my friend and co-host Michael G" -- the 2025 Fall Fund Drive ARP special.
# Jim's show and Jim's programming; Michael was on air with him for the whole drive.
# The mirror of 2025-10-14: two hosts at "full", primary first.
2025-10-21:
  - name: Jim Causey
    coverage: full
  - name: MichaelG
    coverage: full

# "I'll be joined in the booth by David Haldeman, host of Dead Electric!" -- in for the
# whole show. He has no Spinitron persona of his own, so dj_id stays null.
2024-10-15:
  - name: Jim Causey
    coverage: full
  - name: David Haldeman
    coverage: full
