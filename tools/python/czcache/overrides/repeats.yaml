# threshold was left as-is: nothing in the data falls between 0.47 and 0.63, so the exact
# cut point is not load-bearing. 2025-04-22 as a rerun of 2025-04-08 only two weeks later
# was queried and confirmed -- its 0.71 understates the match, because several apparent
# differences are spelling variants of one artist (wanubale / wnbl_, [arsonist] /
