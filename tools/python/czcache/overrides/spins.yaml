# Manual spin-level decisions.
#
# The build merges duplicate spins only when they are a cross-persona double-log (the
# same track logged seconds apart under both of Jim's Spinitron personas at show start).
# Same-persona duplicates are left alone and reported, because a wide gap is usually a
# genuine repeat play within the two-hour show and a short one may be a double-log --
# a distinction only a human can make.
#
# See the "Duplicate spins left alone" table in reports/discrepancies.md.
#
# WHICH ROW SURVIVES: a merge keeps the earliest row, and lifts into it any field that
# row left blank -- so a re-log entered to attach a release or an ISRC contributes it
# without overwriting values the earlier row already had. Where both rows fill a field
# and disagree, the conflict is reported in discrepancies.md rather than resolved
# silently. Check that table before adding an entry here.
#
# Preferring the "better documented" row instead was tried on 2026-08-06 and reverted:
# more populated fields does not mean better values. It swapped a correct UPC for one
# missing its leading zero on 2025-09-09, an album title for a single title on
# 2026-03-10, and a duration by a second on 2025-05-20.
#
# merge_duplicates:
#   - broadcast: "2026-03-17T20:30:00-0700"
#     artist: "yu-more"
#     song: "Deep Mindset"

merge_duplicates:
  # Reviewed 2026-08-05, all six flagged same-persona duplicates. The two below are
  # adjacent spins one to two minutes apart -- a re-log, usually to fix a title or attach
  # a note. Four were kept as two spins: 2025-08-19, 2025-02-11 and 2024-02-20 each play
  # the track at the top and at the close of the night, and MichaelG's workbook labels
  # the 2025-08-19 closer "(OUTRO)" in his own hand. The fourth, 2024-04-16, was merged
  # here until 2026-08-06 and is now left alone -- see the note at the end of the file.

  # seq 21 and 22, 60s apart. The first is titled "Deep Mindset (Original Mix)" and
  # carries the artist note; the second is a re-log of the same track.
  #
  # The two rows name different releases -- "Play Of Color Blue Sound Palette Vol.2
  # Side B" and "Deep Mindset - Single" -- with an ISRC and UPC each, and durations of
  # 5:29 and 5:30. One recording issued on a compilation and as a single, not two
  # different pieces. The release conflict is reported in discrepancies.md.
  - broadcast: "2026-03-17T20:30:00-0700"
    artist: "yu-more"
    song: "Deep Mindset"

  # seq 2 and 3, 125s apart. The second adds the Tractor Tavern release-party note.
  - broadcast: "2025-05-20T20:30:00-0700"
    artist: "Fotoform"
    song: "Skimming the Surface"

  # seq 7 and 8, 97s apart. NOT merged -- see below.
  #
  # 2026-08-06: this entry used to merge the pair, on the stated grounds that the rows
  # were "identical in every field". They are not, in either export. Seven fields differ:
  #
  #   23:00:36  Eclipse  0:55  Logo Presentation Reel 1985 (Instrumentals)/Octabred
  #                           Finders Keepers Records  2013  GBRNP0701170  5060099504990
  #   23:02:13  Eclipse  3:52  Silver Ship
  #                           Seventh Wave  2005  USHM90599070  0799547701029
  #
  # Confirmed by Jim and by the releases themselves. The first is Almay "Eclipse", a
  # 55-second advertising cue and track 5 of Ciani's "Logo Presentation Reels 1985 /
  # Octabred" on Finders Keepers -- a portfolio of her commercial logo work. The second
  # is "Eclipse", track 5 of "Silver Ship" (Seventh Wave, 2005), listed everywhere at
  # 3:52, which matches the logged duration exactly.
  #
  # Two different recordings that share a title, played deliberately on an eclipse-themed
  # night: the short logo cue, then the full piece. The 97-second gap is the 55-second
  # cue plus a mic break. The published convergencezone.fm playlist for Episode 053
  # independently lists Eclipse twice, at 30:36 and 32:13 -- the same gap.
  #
  # Merging them discarded the Silver Ship metadata outright, so the entry is removed.
  # Keeping both is also what makes the set list's second Eclipse resolve to a logged
  # spin rather than surfacing as `planned`.
